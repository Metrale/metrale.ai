<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('metrale-theme');
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Must equal --bg in web-shared/metrale-tokens.css. A meta tag cannot read a
         custom property, so this is the one unavoidable copy of the ground colour;
         theme-color.test.js fails the build if the two drift. -->
    <meta name="theme-color" content="#0E1318" />
    <meta name="theme-color" content="#0E1318" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Same icon set as metrale.ai: one brand, one tab treatment. The icons
         carry ?v=3, as on the site, so a browser holding a cached older icon
         fetches the kit's. -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico?v=3" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png?v=3" />
    <meta name="apple-mobile-web-app-title" content="Metrale Blog" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Metrale" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Only the regular weight. Preloading all four would have the browser
         fetch three faces the first screen never uses, delaying the one it
         does. `crossorigin` is required even same-origin — without it the
         font is fetched a second time and the preload is worse than nothing. -->
    <link rel="preload" href="%sveltekit.assets%/fonts/charter-regular.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="alternate" type="application/rss+xml" title="Metrale blog" href="%sveltekit.assets%/rss.xml" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
