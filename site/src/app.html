<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- First: the charset must sit in the first 1024 bytes, and the viewport
         must be known before the theme script below preloads the hero poster,
         whose imagesizes are read against it. Without it a phone sizes the
         preload for a 980 px desktop viewport and fetches the full size file. -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        // apply also queues the hero poster fetch on the front page. The hero
        // is a product clip behind a poster, and the poster is the largest
        // paint on the page, so it is requested from the head rather than
        // when the parser reaches it. One file serves both themes: the console
        // it shows is dark chrome in either. The srcset and sizes are the ones
        // Hero.svelte draws it with (media.js srcsetOf and heroSizes), so a phone
        // preloads the 640 wide copy it then paints; theme.test.js holds them.
        function apply(t) {
          document.documentElement.setAttribute('data-theme', t);
          if (location.pathname !== '/' && location.pathname !== '/index.html') return;
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.setAttribute('fetchpriority', 'high');
          l.href = '/media/console-ask.webp';
          l.setAttribute('imagesrcset', '/media/console-ask-640.webp 640w, /media/console-ask.webp 1280w');
          l.setAttribute('imagesizes', '(max-width: 1000px) calc(100vw - 64px), 560px');
          document.head.appendChild(l);
        }
        try {
          var t = localStorage.getItem('metrale-theme');
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          apply(t);
        } catch (e) {
          apply('dark');
        }
      })();
    </script>
    <meta name="description" content="Metrale is the inference economics platform for GPUs you already own. Faster inference, stronger governance, a fraction of what you pay today." />
    <!-- IBM Plex, attached late on purpose. In the bundle, preloaded or not, the
         font downloads sat on the critical path of the first paint and cost every
         page a point of Lighthouse performance against a gate that demands 100.
         So the page paints in fallbacks that occupy the same space as Plex
         (src/styles/fonts.css) and the real faces swap in without moving
         anything.

         "Late" means after the first contentful paint AND after load, then at
         idle. Not just after load: on /control load fires at 140 ms and the
         first paint lands at 320 ms, so a load listener still fetched the
         fonts ahead of the paint. Once the files are in the visitor's cache
         the sheet is attached straight away, which costs nothing.

         A second script tag, not the boot script above: theme.test.js runs
         that one against a handful of fake globals. -->
    <script>
      (function () {
        // Absolute, not the assets placeholder: that renders as a path relative
        // to each page, which would give this script different bytes at every
        // depth and so a different hash in the page's CSP (svelte.config.js).
        var href = '/fonts/type-v2.css';
        var done = false;
        function attach() {
          if (done) return;
          done = true;
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = href;
          document.head.appendChild(l);
          try {
            localStorage.setItem('metrale-fonts', '1');
          } catch (e) {}
        }
        var warm = false;
        try {
          warm = localStorage.getItem('metrale-fonts') === '1';
        } catch (e) {}
        if (warm) return attach();

        var painted = false;
        var loaded = document.readyState === 'complete';
        function go() {
          if (!painted || !loaded) return;
          if (window.requestIdleCallback) requestIdleCallback(attach, { timeout: 2000 });
          else setTimeout(attach, 200);
        }
        try {
          new PerformanceObserver(function (list, observer) {
            if (list.getEntriesByName('first-contentful-paint').length) {
              observer.disconnect();
              painted = true;
              go();
            }
          }).observe({ type: 'paint', buffered: true });
        } catch (e) {
          painted = true;
        }
        if (!loaded)
          addEventListener('load', function () {
            loaded = true;
            go();
          });
        // Whatever happens above, the brand typeface still arrives.
        setTimeout(attach, 5000);
      })();
    </script>
    <noscript><link rel="stylesheet" href="%sveltekit.assets%/fonts/type-v2.css" /></noscript>
    <!-- The app starts after the first paint. Every page is prerendered, so it
         paints from the HTML alone, and the app's scripts only make it
         interactive. Started at once, as SvelteKit does, they download beside
         the HTML and held every page at 91 to 99 on Lighthouse's mobile run;
         the same pages without them scored 100. src/lib/boot/defer-boot.js
         writes each page with its boot script and its modulepreloads inert,
         and this opens both: the preloads go back into the head, then a copy
         of the boot script runs. The copy has the same bytes, so its hash in
         the page's CSP still matches.

         "After the first paint" means the frame after load, so a large image
         is on screen first. Not later than one second after the paint if load
         is slow, at once if the visitor reaches for the page (a tap, a key,
         focus), and never later than five seconds whatever happens.

         The service worker is registered here, after the start, for the same
         reason: SvelteKit's own registration waits for a load event that has
         already passed by then. -->
    <script>
      (function () {
        var started = false;
        var cues = ['pointerdown', 'keydown', 'touchstart', 'focusin'];
        function start() {
          if (started) return;
          var boot = document.querySelector('script[type="metrale/boot"]');
          if (!boot) return;
          started = true;
          for (var i = 0; i < cues.length; i++) removeEventListener(cues[i], start, true);
          var preloads = document.getElementById('metrale-preloads');
          if (preloads) document.head.appendChild(preloads.content);
          var run = document.createElement('script');
          run.textContent = boot.textContent;
          boot.parentNode.replaceChild(run, boot);
          if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');
        }
        for (var i = 0; i < cues.length; i++) addEventListener(cues[i], start, { capture: true, passive: true });

        var painted = false;
        var loaded = document.readyState === 'complete';
        var late = false;
        function go() {
          if (painted && (loaded || late))
            requestAnimationFrame(function () {
              setTimeout(start, 0);
            });
        }
        function paint() {
          painted = true;
          setTimeout(function () {
            late = true;
            go();
          }, 1000);
          go();
        }
        try {
          new PerformanceObserver(function (list, observer) {
            if (list.getEntriesByName('first-contentful-paint').length) {
              observer.disconnect();
              paint();
            }
          }).observe({ type: 'paint', buffered: true });
        } catch (e) {
          paint();
        }
        if (!loaded)
          addEventListener('load', function () {
            loaded = true;
            go();
          });
        setTimeout(start, 5000);
      })();
    </script>
    <!-- Must equal --bg in web-shared/metrale-tokens.css. A meta tag cannot read a
         custom property, so this is the one unavoidable copy of the ground colour;
         theme-color.test.js fails the build if the two drift. -->
    <meta name="theme-color" content="#0E1318" />
    <meta name="theme-color" content="#0E1318" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <!-- Explicit rather than inherited: several engines treat a missing robots
         directive as a reason to clip snippets and thumbnails. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Icons: the brand kit's own set, as the kit's README places them
         (scripts/brand/kit.mjs copies the files). The .ico carries the compact
         mark at 16, 32 and 48 px for surfaces that ignore SVG; the SVG wins
         wherever it is supported. The touch icon is opaque, on the ground, so
         iOS has no transparency to composite onto black. They carry ?v=3:
         static files are cached for a month, so a new address is what makes
         a returning browser fetch the kit's icons over an older cached set. -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico?v=3" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png?v=3" />
    <meta name="apple-mobile-web-app-title" content="Metrale" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Metrale, the inference economics platform" />
    <meta property="og:description" content="Faster inference, stronger governance, a fraction of what you pay today. Runs your models faster on the GPUs you own, keeps every prompt inside your perimeter, and shows your CFO what each workload costs." />
    <meta property="og:site_name" content="Metrale" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://metrale.ai/og-image-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Metrale, the inference economics platform" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Metrale, the inference economics platform" />
    <meta name="twitter:description" content="Faster inference, stronger governance, a fraction of what you pay today. Every number is a receipt." />
    <meta name="twitter:image" content="https://metrale.ai/og-image-v2.png" />
    <meta name="twitter:image:alt" content="Metrale, the inference economics platform" />

    <!-- The plain-text brief answer engines read. Generated from the same
         sources as the page by scripts/gen-llms.mjs. -->
    <link rel="alternate" type="text/plain" href="%sveltekit.assets%/llms.txt" title="llms.txt" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
