# Link check over the built site: internal links only, so a PR run is
# deterministic. Run from the repository root after the build:
#   lychee --config lychee.toml 'site/build/**/*.html'
# External links are checked on a schedule, not here.

offline = true
root_dir = "site/build"

# Cloudflare Pages serves /pricing from pricing.html and / from index.html.
fallback_extensions = ["html"]
# "." keeps /platform valid where platform.html sits beside a platform/ directory.
index_files = ["index.html", "."]

# An anchor that names no id on its page is a broken link too.
include_fragments = "anchor-only"

no_progress = true
