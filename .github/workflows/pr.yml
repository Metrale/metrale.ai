# The checks every pull request to main must pass. Each is its own job so branch
# protection can require it by name; the job names are the check names.
#
# Fork pull requests run every check but `preview`, and no job here reads a secret
# except `preview`, which only runs for branches of this repository.

name: pr

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          v=8.30.1
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          sudo mv gitleaks /usr/local/bin/
      # Every commit in the pull request, not just its final tree: a key added in
      # one commit and deleted in the next is still published by the push.
      - name: Scan the pull request's commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --no-banner --verbose --log-opts="$BASE..$HEAD" .

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-site
      - name: ESLint
        working-directory: site
        run: bun run lint
      - name: Prettier
        working-directory: site
        run: bun run format:check

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-site
      - name: svelte-check
        working-directory: site
        run: bun run check

  spelling:
    name: spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: cspell
        run: npx --yes cspell@10.3.3 --no-progress --config cspell.json "site/src/**" "site/*.md" README.md

  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.23.3

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-site
      - name: Unit tests
        working-directory: site
        run: bun run test:unit
      # The suite is scoped to src/lib, so a test file anywhere else is collected
      # by nothing and reports nothing: it would look like coverage and be none.
      - name: No test file lives where the suite will not look
        run: |
          stray=$(find site/src -name '*.test.*' -not -path '*/src/lib/*' | sort)
          if [ -n "$stray" ]; then
            echo "::error title=Test files outside the tested path::these are collected by no suite:"
            printf '  %s\n' $stray
            exit 1
          fi
      - name: Chevron-field contrast budget
        run: bun .contrast-check.mjs

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-site
      - uses: ./.github/actions/engine-inputs
        with:
          github-token: ${{ github.token }}
      - name: Install browsers
        working-directory: site
        run: bun x playwright install --with-deps chromium
      # The suite builds the site itself, then serves it with vite preview.
      - name: Browser suite
        working-directory: site
        run: bun run test:e2e
      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-site
        with:
          commit: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-build
          path: site/build
          retention-days: 7
          if-no-files-found: error

  guide:
    name: guide
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-site
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-build
          path: site/build
      - name: The site guide's ledger is current
        working-directory: site
        run: bun run guide:check

  links:
    name: links
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-build
          path: site/build
      - name: Install lychee
        run: |
          v=0.24.2
          curl -fsSLo lychee.tgz "https://github.com/lycheeverse/lychee/releases/download/lychee-v$v/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  lychee.tgz" | sha256sum -c -
          tar -xzf lychee.tgz && rm lychee.tgz
          sudo mv "$(find . -maxdepth 2 -type f -name lychee | head -1)" /usr/local/bin/lychee
      # Internal links only, so the result depends on nothing outside the build.
      # External links are checked on a schedule by links-external.yml.
      - name: Internal links resolve
        run: LINKS_COMMAND

  lighthouse:
    name: lighthouse
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-build
          path: site/build
      # 100 in performance, accessibility, best practices and SEO on every public
      # page, and no third-party request. site/lighthouse/README.md has the rules.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun --config=site/lighthouse/lighthouserc.json

  # Not a required check: fork pull requests skip it, and they must still be
  # mergeable. Secrets are only read here, and only for this repository's branches.
  preview:
    name: preview
    needs: build
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-build
          path: site/build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Deploy a preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
        run: |
          npx --yes wrangler@4 pages deploy site/build --project-name=metrale-ai \
            --branch="$BRANCH" --commit-hash="$HEAD_SHA" --commit-dirty=false
          url=$(jq -r 'select(.type=="pages-deploy-detailed") | (.alias // .url)' "$WRANGLER_OUTPUT_FILE_PATH" | tail -1)
          [ -n "$url" ] && [ "$url" != "null" ] || { echo "::error::wrangler reported no preview URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Preview of ${HEAD_SHA:0:7}: $URL"
