# What a build reads from outside this repository, all public:
#   Metrale/metrale-inference-alpha, at site/engine.ref
#                            benchmark records, gate descriptors, the ladder, the
#                            changelog and the baselines (METRALE_ENGINE_ROOT)
#   Metrale/metralectl       the recipe registry, the model list (METRALE_RECIPES_ROOT),
#                            and the installers install.sh and install.ps1
# The variables are exported for the rest of the job, so `vite build` and the
# browser suite (which builds on its own) see the same inputs.

name: Engine inputs
description: Check out the engine at its pin and the recipe registry, and export the METRALE_* variables.

inputs:
  github-token:
    description: Token for the star and contributor generators (public data only)
    required: true

runs:
  using: composite
  steps:
    - name: Read the engine pin
      id: engine
      shell: bash
      run: echo "ref=$(tr -d '[:space:]' < site/engine.ref)" >> "$GITHUB_OUTPUT"

    - name: Checkout the recipe registry
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: Metrale/metralectl
        path: .inputs/registry
        persist-credentials: false

    # Treeless, with history: the gate generator walks commit ancestry; the files
    # it reads are only the sparse paths below.
    - name: Checkout the engine at the pinned commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: Metrale/metrale-inference-alpha
        ref: ${{ steps.engine.outputs.ref }}
        path: .inputs/engine
        fetch-depth: 0
        filter: blob:none
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /CHANGELOG.md
          /README.md
          /QUICKSTART.md
          /CONTRIBUTING.md
          /SECURITY.md
          /CITATIONS.md
          /docs/ARCHITECTURE.md
          /docs/HARDWARE.md
          /docs/DEPLOYMENT.md
          /docs/GB10_DEPLOYMENT_GUIDE.md
          /docs/ROBUSTNESS.md
          /bench/ladder38/
          /.benchmarks/
          /crates/metrale-plugin/src/benchmarks/
          /tests/baselines/

    # The install command the site prints is served from these two files, so both
    # are required: a missing one is a 404 for the headline instruction. They come
    # from the registry checkout above, beside the command they install.
    - name: Copy the installers
      shell: bash
      run: |
        for f in install.sh install.ps1; do
          cp ".inputs/registry/scripts/$f" "site/static/$f"
          chmod 0755 "site/static/$f"
        done

    - name: Export the build variables
      shell: bash
      env:
        GH_TOKEN_IN: ${{ inputs.github-token }}
      run: |
        {
          echo "METRALE_RECIPES_ROOT=$GITHUB_WORKSPACE/.inputs/registry/recipes"
          echo "METRALE_ENGINE_ROOT=$GITHUB_WORKSPACE/.inputs/engine"
          echo "METRALE_BASELINES_ROOT=$GITHUB_WORKSPACE/.inputs/engine/tests/baselines"
          echo "GH_TOKEN=$GH_TOKEN_IN"
        } >> "$GITHUB_ENV"

    # The front page prints `<command> run <flagship>`; this ties that name to a
    # recipe that exists in the registry the build ships against.
    - name: The advertised recipe exists
      shell: bash
      working-directory: site
      run: bun scripts/check-flagship.mjs
