# What a build reads from outside this repository, all public:
#   the engine (ENGINE_SLUG in web-shared/sources.mjs), at site/engine.ref
#                            benchmark records, gate descriptors and limits, the
#                            ladders, the changelog, the baselines and the
#                            recipes, which are the model list (METRALE_ENGINE_ROOT)
#   the launcher (LAUNCHER_SLUG), at main
#                            its README and the installers install.sh and
#                            install.ps1 (METRALE_LAUNCHER_ROOT)
# The variables are exported for the rest of the job, so `vite build` and the
# browser suite (which builds on its own) see the same inputs.

name: Engine inputs
description: Check out the engine at its pin and the launcher, and export the METRALE_* variables.

inputs:
  github-token:
    description: Token for the star generator (public data only)
    required: true

runs:
  using: composite
  steps:
    - name: Read the engine pin
      id: engine
      shell: bash
      run: |
        slug=$(node --input-type=module -e "const m = await import('./web-shared/sources.mjs'); console.log(m.ENGINE_SLUG)")
        [ -n "$slug" ] || { echo "::error::web-shared/sources.mjs names no ENGINE_SLUG"; exit 1; }
        launcher=$(node --input-type=module -e "const m = await import('./web-shared/sources.mjs'); console.log(m.LAUNCHER_SLUG)")
        [ -n "$launcher" ] || { echo "::error::web-shared/sources.mjs names no LAUNCHER_SLUG"; exit 1; }
        echo "slug=$slug" >> "$GITHUB_OUTPUT"
        echo "launcher=$launcher" >> "$GITHUB_OUTPUT"
        echo "ref=$(tr -d '[:space:]' < site/engine.ref)" >> "$GITHUB_OUTPUT"

    - name: Checkout the launcher
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ steps.engine.outputs.launcher }}
        path: .inputs/launcher
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /README.md
          /scripts/install.sh
          /scripts/install.ps1

    # Treeless, with history: the gate generator walks commit ancestry; the files
    # it reads are only the sparse paths below.
    - name: Checkout the engine at the pinned commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ steps.engine.outputs.slug }}
        ref: ${{ steps.engine.outputs.ref }}
        path: .inputs/engine
        fetch-depth: 0
        filter: blob:none
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /CHANGELOG.md
          /README.md
          /QUICKSTART.md
          /CONTRIBUTING.md
          /SECURITY.md
          /CITATIONS.md
          /docs/ARCHITECTURE.md
          /docs/HARDWARE.md
          /docs/DEPLOYMENT.md
          /docs/GB10_DEPLOYMENT_GUIDE.md
          /docs/ROBUSTNESS.md
          /bench/ladder38/
          /bench/baselines/
          /.benchmarks/
          /crates/bench/src/benchmarks/
          /crates/bench/src/hardware/energy.rs
          /crates/bench/src/hardware/energy_sampler.rs
          /kernels/gb10/HARDWARE.toml
          /kernels/gb10/*/BENCH.toml
          /recipes/
          /test_data/gate-records/
          /tests/baselines/

    # The install command the site prints is served from these two files, so both
    # are required: a missing one is a 404 for the headline instruction. They come
    # from the launcher checkout above, beside the command they install.
    - name: Copy the installers
      shell: bash
      run: |
        for f in install.sh install.ps1; do
          cp ".inputs/launcher/scripts/$f" "site/static/$f"
          chmod 0755 "site/static/$f"
        done

    - name: Export the build variables
      shell: bash
      env:
        GH_TOKEN_IN: ${{ inputs.github-token }}
      run: |
        {
          echo "METRALE_ENGINE_ROOT=$GITHUB_WORKSPACE/.inputs/engine"
          echo "METRALE_LAUNCHER_ROOT=$GITHUB_WORKSPACE/.inputs/launcher"
          echo "METRALE_BASELINES_ROOT=$GITHUB_WORKSPACE/.inputs/engine/tests/baselines"
          echo "GH_TOKEN=$GH_TOKEN_IN"
        } >> "$GITHUB_ENV"

    # The front page prints `<command> run <flagship>`; this ties that name to a
    # recipe that exists in the engine's recipes/ at the pinned commit.
    - name: The advertised recipe exists
      shell: bash
      working-directory: site
      run: bun scripts/check-flagship.mjs
