# The one way the site is built in CI. pr.yml, deploy.yml and prime-worker.yml all
# call this, so a preview, a deploy and the guide's knowledge base come from the
# same inputs. It writes site/build, with build/version.txt holding the commit it
# was built from.

name: Build the site
description: Set up, fetch the engine inputs, build site/build and stamp it.

inputs:
  commit:
    description: The commit written to build/version.txt
    required: true
  github-token:
    description: Token for the star and contributor generators (public data only)
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-site
    - uses: ./.github/actions/engine-inputs
      with:
        github-token: ${{ inputs.github-token }}

    - name: Build
      shell: bash
      working-directory: site
      run: bun x --bun vite build

    # A page's <title> can vanish while the rest of its head survives: a layout
    # title and a page title compete for one head slot, and /control once shipped
    # with the home page's title. Catch it before it deploys.
    - name: Every route kept its own title
      shell: bash
      working-directory: site
      run: |
        fail=0
        check() { # file  expected-substring
          got=$(grep -o '<title>[^<]*' "build/$1" | head -1)
          case "$got" in
            *"$2"*) echo "ok   $1 -> $got" ;;
            *) echo "::error::build/$1 has title \"$got\", expected one containing \"$2\""; fail=1 ;;
          esac
        }
        check index.html       'Metrale, the inference economics platform'
        check engine.html      'Metrale Engine, pure Rust inference'
        check why-metrale.html 'Why Metrale'
        check pricing.html     'Pricing'
        check control.html     'Control plane'
        check diligence.html   'Verification steps'
        exit "$fail"

    - name: Stamp the build
      shell: bash
      env:
        COMMIT: ${{ inputs.commit }}
      run: printf '%s\n' "$COMMIT" > site/build/version.txt
